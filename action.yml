name: mo3ta-coverage
description: >-
  Run tests for changed files in a PR and enforce a minimum changed-line
  coverage threshold. Maps changed source files to related Jest tests
  (naming convention + reverse-import walk), runs them with --coverage,
  and fails when changed-line coverage is below the limit. Writes a
  markdown coverage table that this action appends to the GitHub Actions
  job summary and (by default) posts as a single, updatable comment on
  the PR.
author: MahmoudMabrok

branding:
  icon: shield
  color: green

inputs:
  base:
    description: >-
      Base branch/revision to compare against. Leave empty to auto-resolve:
      pull_request → origin/<PR base branch>, push → the previous commit
      (HEAD~1, falling back to origin/main), other events → origin/main.
    required: false
    default: ''
  mode:
    description: 'Execution mode: fast, smart, or full'
    required: false
    default: smart
  depth:
    description: 'Smart mode max reverse-dependency depth (1 or 2 recommended)'
    required: false
    default: '2'
  limit:
    description: Minimum required coverage percentage for changed lines (e.g. 80)
    required: false
    default: '80'
  ci:
    description: 'CI mode: clean console output and write a markdown table to ci-report-path'
    required: false
    default: 'true'
  ci-report-path:
    description: Where to save the CI markdown table (relative to working-directory)
    required: false
    default: coverage/mo3ta-coverage-report.md
  show-covered:
    description: Also list covered changed lines in the report
    required: false
    default: 'false'
  files:
    description: Explicit list of files to scan (space- or comma-separated) instead of auto-detecting changed files
    required: false
    default: ''
  files-from:
    description: Path to a newline-separated file list to scan instead of auto-detecting changed files
    required: false
    default: ''
  report-to-summary:
    description: Append the markdown coverage table to the GitHub Actions job summary
    required: false
    default: 'true'
  comment-on-pr:
    description: >-
      Post the coverage report as a single, updatable comment on the PR
      (the previous report comment is updated in place on re-runs).
      Requires the pull_request event and a token with the 'pull-requests: write'
      permission.
    required: false
    default: 'true'
  comment-header:
    description: Heading written at the top of the PR report comment; also used to find the previous comment and update it
    required: false
    default: mo3ta-coverage report
  working-directory:
    description: Working directory where the CLI is executed (must contain the git checkout)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run mo3ta-coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MO3TA_BASE: ${{ inputs.base }}
        MO3TA_EVENT: ${{ github.event_name }}
        MO3TA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MO3TA_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        MO3TA_MODE: ${{ inputs.mode }}
        MO3TA_DEPTH: ${{ inputs.depth }}
        MO3TA_LIMIT: ${{ inputs.limit }}
        MO3TA_CI: ${{ inputs.ci }}
        MO3TA_CI_REPORT: ${{ inputs.ci-report-path }}
        MO3TA_SHOW_COVERED: ${{ inputs.show-covered }}
        MO3TA_FILES: ${{ inputs.files }}
        MO3TA_FILES_FROM: ${{ inputs.files-from }}
        MO3TA_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail

        # Resolve the base ref: an explicit 'base' input wins, otherwise
        # auto-resolve per the triggering event.
        if [ -z "$MO3TA_BASE" ]; then
          if [ -n "$MO3TA_PR_BASE_SHA" ]; then
            # Pull request: diff against the exact base commit of the PR.
            # The sha from the event payload is always present (works even
            # with a shallow fetch) and is already included in the merge
            # ref of the pull_request checkout.
            if git rev-parse --verify --quiet "${MO3TA_PR_BASE_SHA}^{commit}" >/dev/null 2>&1; then
              MO3TA_BASE="$MO3TA_PR_BASE_SHA"
            else
              MO3TA_BASE="${GITHUB_BASE_REF:-origin/main}"
            fi
          elif [ "$MO3TA_EVENT" = "push" ]; then
            # Push: diff against the previous commit.
            if git rev-parse --verify --quiet "HEAD~1" >/dev/null 2>&1; then
              MO3TA_BASE="HEAD~1"
            else
              MO3TA_BASE="origin/main"
            fi
          else
            MO3TA_BASE="origin/main"
          fi
          echo "::notice::mo3ta-coverage: no 'base' input, auto-resolved to ${MO3TA_BASE}"
        fi

        ARGS=(
          "node" "$MO3TA_ACTION_PATH/dist/index.js"
          "--base" "$MO3TA_BASE"
          "--mode" "$MO3TA_MODE"
          "--depth" "$MO3TA_DEPTH"
          "--limit" "$MO3TA_LIMIT"
          "--ci" "$MO3TA_CI"
          "--ciReport" "$MO3TA_CI_REPORT"
          "--showCovered" "$MO3TA_SHOW_COVERED"
        )

        if [ -n "$MO3TA_FILES" ]; then
          # shellcheck disable=SC2206
          FILES_LIST=($MO3TA_FILES)
          ARGS+=("--files" "${FILES_LIST[@]}")
        fi

        if [ -n "$MO3TA_FILES_FROM" ]; then
          ARGS+=("--filesFrom" "$MO3TA_FILES_FROM")
        fi

        echo "${ARGS[*]}"
        "${ARGS[@]}"

    - name: Save report to GitHub Actions summary
      if: inputs.report-to-summary == 'true' && inputs.ci == 'true' && env.MO3TA_CI_REPORT != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MO3TA_CI_REPORT: ${{ inputs.ci-report-path }}
      run: |
        set -uo pipefail
        if [ -f "$MO3TA_CI_REPORT" ]; then
          cat "$MO3TA_CI_REPORT" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "::warning::Coverage report not found at $MO3TA_CI_REPORT"
        fi

    - name: Update (or create) the PR report comment
      if: always() && inputs.comment-on-pr == 'true' && inputs.ci == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MO3TA_CI_REPORT: ${{ inputs.ci-report-path }}
        MO3TA_COMMENT_HEADER: ${{ inputs.comment-header }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail

        if [ -z "$GITHUB_PR_NUMBER" ] || [ -z "$GITHUB_TOKEN" ] || [ -z "$GITHUB_REPOSITORY" ]; then
          echo "Skipping PR comment: no pull_request number or token on this event."
          exit 0
        fi
        if [ ! -f "$MO3TA_CI_REPORT" ]; then
          echo "::warning::No report file at $MO3TA_CI_REPORT — nothing to comment."
          exit 0
        fi

        # Single, updatable comment: update in place when a previous
        # report comment (matched by header) exists on this PR.
        OLD_ID=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$GITHUB_PR_NUMBER/comments" \
          | jq -r --arg h "$MO3TA_COMMENT_HEADER" \
              '.[] | select(.body | contains($h)) | .id' | head -n 1 || echo "")

        BODY=$(cat "$MO3TA_CI_REPORT")
        if [ -n "$OLD_ID" ]; then
          curl -sf -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/comments/$OLD_ID" \
            --data "$(jq -n --arg b "$BODY" '{body: $b}')" > /dev/null
          echo "Updated existing PR comment $OLD_ID."
          echo "::notice::mo3ta-coverage: updated PR comment $OLD_ID"
        else
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$GITHUB_PR_NUMBER/comments" \
            --data "$(jq -n --arg b "$BODY" '{body: $b}')" > /dev/null
          echo "Created a new PR report comment."
          echo "::notice::mo3ta-coverage: created PR report comment"
        fi
